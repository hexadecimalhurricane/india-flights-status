name = "sight"
main = "src/worker.ts"
compatibility_date = "2025-01-01"

# One deployment serves both:
#   /describe  -> Worker code (proxies to Anthropic with the key)
#   /*         -> static PWA assets from ../web
#
# Set secrets first:
#   npx wrangler secret put ANTHROPIC_API_KEY
#   npx wrangler secret put CLIENT_TOKEN     # optional, locks the proxy to your app
#
# Deploy:
#   npx wrangler deploy

[assets]
directory = "../web"
binding = "ASSETS"
not_found_handling = "single-page-application"

[vars]
MODEL = "claude-opus-4-7"
MAX_TOKENS = "400"
