<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sight">
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>Sight</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <video id="cam" autoplay playsinline muted></video>
  <canvas id="overlay"></canvas>

  <header id="status" aria-live="polite">Tap anywhere to start</header>

  <button id="describeBtn" aria-label="Describe what's around me">Describe</button>

  <section id="settings" hidden>
    <h2>Settings</h2>
    <label>Proxy URL <input id="proxyUrl" type="url" placeholder="https://sight-proxy.your-name.workers.dev"></label>
    <label>Client token (optional) <input id="clientToken" type="password"></label>
    <label>Voice <select id="voice"></select></label>
    <label>Speech rate <input id="rate" type="range" min="0.7" max="1.6" step="0.05" value="1.05"></label>
    <label><input id="earcons" type="checkbox" checked> Spatial earcons</label>
    <label><input id="ambient" type="checkbox" checked> Sound classification</label>
    <button id="closeSettings">Done</button>
  </section>

  <button id="settingsBtn" aria-label="Settings">⚙</button>

  <script type="module" src="js/main.js"></script>
</body>
</html>
