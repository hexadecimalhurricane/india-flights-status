<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sight">
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>Sight</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <video id="cam" autoplay playsinline muted aria-hidden="true"></video>
  <canvas id="overlay" aria-hidden="true"></canvas>

  <main id="screen" role="main" aria-label="Sight. Tap anywhere to begin. Then single tap to describe what's ahead, double tap to start road crossing mode, or hold for instructions.">
    <header id="status" aria-live="polite" aria-atomic="true">Sight. Tap anywhere to begin.</header>
  </main>

  <button id="settingsBtn" aria-label="Settings (for sighted helpers)">⚙</button>

  <section id="settings" hidden>
    <h2>Settings</h2>
    <p class="hint">For sighted helpers. The blind user does not need any of this — the app is voice-first.</p>
    <label>Proxy URL <input id="proxyUrl" type="url" placeholder="leave blank to use this site"></label>
    <label>Client token (optional) <input id="clientToken" type="password"></label>
    <label>Voice <select id="voice"></select></label>
    <label>Speech rate <input id="rate" type="range" min="0.7" max="1.6" step="0.05" value="1.05"></label>
    <label><input id="earcons" type="checkbox" checked> Spatial earcons</label>
    <label><input id="ambient" type="checkbox" checked> Sound classification</label>
    <button id="closeSettings">Done</button>
  </section>

  <script type="module" src="js/main.js"></script>
</body>
</html>
